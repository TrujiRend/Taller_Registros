<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <form id="registro" action="https://jsonplaceholder.typicode.com/posts" method="post">
    <label for="nombre">Nombre completo</label>
    <input id="nombre" name="nombre" type="text"
           required minlength="3" maxlength="60" autocomplete="name">

    <label for="email">Correo</label>
    <input id="email" name="email" type="email" required autocomplete="email">

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" required
           minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
           autocomplete="new-password">

    <label for="confirmar">Confirmar contraseña</label>
    <input id="confirmar" name="confirmar" type="password" required
           autocomplete="new-password">

    <label for="edad">Edad</label>
    <input id="edad" name="edad" type="number" required
           min="18" max="120" step="1">

    <label for="pais">País</label>
    <select id="pais" name="pais" required>
      <option value="">Elige un país</option>
      <option value="CO">Colombia</option>
      <option value="MX">México</option>
      <option value="AR">Argentina</option>
      <option value="ES">España</option>
      <option value="CL">Chile</option>
      <option value="PE">Perú</option>
      <option value="otro">Otro</option>
    </select>

    <label for="terminos" class="checkbox">
      <input id="terminos" name="terminos" type="checkbox" required>
      Acepto los términos y condiciones
    </label>

    <button type="submit">Crear cuenta</button>
    <p id="mensaje" role="status"></p>
  </form>
  <script src="app.js"></script>
</body>
</html>
